---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: '>=0.0.0'
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 12h
  values:
    replicaCount: 1
    service:
      type: ClusterIP
      port: 80
    # Enable Flux plugin
    config:
      pluginsDir: "/headlamp-plugins"
    volumes:
      - name: plugins
        emptyDir: {}
    volumeMounts:
      - name: plugins
        mountPath: /headlamp-plugins
    initContainers:
      - name: flux-plugin
        image: busybox:latest
        command:
          - sh
          - -c
          - |
            mkdir -p /headlamp-plugins
            cd /headlamp-plugins
            wget -q https://github.com/headlamp-k8s/plugins/releases/download/flux-0.5.0/headlamp-k8s-flux-0.5.0.tar.gz
            tar -xzf headlamp-k8s-flux-0.5.0.tar.gz
            rm headlamp-k8s-flux-0.5.0.tar.gz
        volumeMounts:
          - name: plugins
            mountPath: /headlamp-plugins
